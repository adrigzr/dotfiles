# Starship prompt configuration
# https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'onedark'

format = """
$os\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$package\
$nodejs\
$python\
$rust\
$golang\
$lua\
$docker_context\
$aws\
$container\
$cmd_duration\
$fill\
$status\
$time\
$battery\
$line_break\
$jobs\
$character"""

# -- Palette ---------------------------------------------------------------

[palettes.onedark]
fg = '#abb2bf'
bg = '#282c34'
red = '#e06c75'
green = '#98c379'
yellow = '#e5c07b'
blue = '#61afef'
magenta = '#c678dd'
cyan = '#56b6c2'
orange = '#d19a66'
dimmed = '#5c6370'

# -- Line 1: Left side -----------------------------------------------------

[os]
disabled = false
style = 'fg:dimmed'
format = '[$symbol ]($style)'

[os.symbols]
Macos = ''
Linux = ''
Ubuntu = ''
Debian = ''
Fedora = ''
Arch = ''
Alpine = ''

[directory]
truncation_length = 3
truncation_symbol = '.../'
read_only = ' 󰌾'
style = 'bold fg:blue'
repo_root_style = 'bold fg:blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = ' '
style = 'fg:magenta'
format = '[$symbol$branch(:$remote_branch)]($style) '
truncation_length = 24
truncation_symbol = '...'

[git_state]
style = 'fg:orange'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = 'fg:red'
format = '([$all_status$ahead_behind]($style) )'
ahead = '[↑${count}](fg:green)'
behind = '[↓${count}](fg:red)'
diverged = '[↑${ahead_count}↓${behind_count}](fg:orange)'
conflicted = '[=${count}](fg:red)'
untracked = '[?${count}](fg:yellow)'
stashed = '[*${count}](fg:dimmed)'
modified = '[!${count}](fg:orange)'
staged = '[+${count}](fg:green)'
renamed = '[»${count}](fg:cyan)'
deleted = '[✘${count}](fg:red)'

[git_metrics]
disabled = false
added_style = 'fg:green'
deleted_style = 'fg:red'
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[package]
symbol = '󰏗 '
style = 'fg:orange'
format = '[$symbol$version]($style) '

[nodejs]
symbol = ' '
style = 'fg:green'
format = '[$symbol$version]($style) '
detect_files = ['package.json', '.node-version', '.nvmrc']
detect_folders = []

[python]
symbol = ' '
style = 'fg:yellow'
format = '[$symbol$version( \($virtualenv\))]($style) '

[rust]
symbol = '󱘗 '
style = 'fg:orange'
format = '[$symbol$version]($style) '

[golang]
symbol = ' '
style = 'fg:cyan'
format = '[$symbol$version]($style) '

[lua]
symbol = ' '
style = 'fg:blue'
format = '[$symbol$version]($style) '

[docker_context]
symbol = ' '
style = 'fg:cyan'
format = '[$symbol$context]($style) '

[aws]
symbol = ' '
style = 'fg:yellow'
format = '[$symbol($profile )(\($region\))]($style) '

[container]
symbol = '⬢ '
style = 'fg:dimmed'
format = '[$symbol$name]($style) '

[cmd_duration]
min_time = 2_000
style = 'fg:dimmed'
format = '[ $duration]($style) '

# -- Line 1: Spacer --------------------------------------------------------

[fill]
symbol = ' '

# -- Line 1: Right side ----------------------------------------------------

[status]
disabled = false
style = 'fg:red'
symbol = ' '
format = '[$symbol$status]($style) '

[jobs]
style = 'fg:magenta'
symbol = '✦'
format = '[$symbol$number]($style) '
number_threshold = 2
symbol_threshold = 1

[time]
disabled = false
style = 'fg:dimmed'
format = '[$time]($style) '
time_format = '%R'

[battery]
disabled = false
format = '[$symbol$percentage]($style) '

[[battery.display]]
threshold = 20
style = 'fg:red'

[[battery.display]]
threshold = 40
style = 'fg:yellow'

# -- Line 2: Input ---------------------------------------------------------

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:magenta)'
vimcmd_replace_symbol = '[❮](bold fg:magenta)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'
