# ==============================================================================
# Terminal
# ==============================================================================

# Use tmux-256color for proper true color, italic, and styled underline support.
# This replaces the old screen-256color + custom terminfo workaround.
set -g default-terminal "tmux-256color"

# Tell tmux what the outer terminal supports.
# terminal-features is the modern (tmux 3.2+) way to declare capabilities.
# 256/RGB=colors, usstyle=styled+colored underlines, strikethrough, overline, title, clipboard.
# NOTE: terminal-features are read at client attach time. Changes require killing the tmux
# server and restarting (tmux kill-server), not just a config reload.
set -sa terminal-features 'xterm-ghostty:256:RGB:usstyle:strikethrough:overline:title:clipboard'
set -sa terminal-features 'xterm-256color:256:RGB:usstyle:strikethrough:overline:title:clipboard'

# Tc for true color. Italic/strikethrough/underline capabilities are handled by
# terminal-features above (usstyle, strikethrough, overline).
set -s terminal-overrides ',*:Tc:sitm=\E[3m:ritm=\E[23m'

# Enable OSC 52 clipboard (Ghostty handles this natively).
set -s set-clipboard on

# Allow passthrough sequences (needed for image protocols, etc.).
set -g allow-passthrough on

# ==============================================================================
# General
# ==============================================================================

# Rebind prefix to Ctrl+Space.
unbind C-b
set -g prefix C-Space

# Reload config.
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# No delay for escape sequences.
set -sg escape-time 0

# Start indices at 1.
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed.
set -g renumber-windows on

# Auto-rename windows and set terminal title.
setw -g automatic-rename on
set -g set-titles on

# Scrollback buffer.
set -g history-limit 50000

# Focus events for Neovim autoread / FocusGained.
set -g focus-events on

# Show pane numbers longer (2 seconds).
set -g display-panes-time 2000

# When a session is destroyed, switch to another instead of detaching.
set -g detach-on-destroy off

# Rounded borders for popup windows.
set -g popup-border-lines rounded

# ==============================================================================
# Bell & Activity
# ==============================================================================

set -g bell-action other
set -g visual-bell off
setw -g monitor-activity off
set -g visual-activity off

# ==============================================================================
# Vi Mode
# ==============================================================================

set -g status-keys vi
setw -g mode-keys vi

# ==============================================================================
# Copy Mode
# ==============================================================================

# Enter copy mode / paste buffer.
bind C copy-mode
bind V paste-buffer

# Vi-style selection and yank (consolidated, placed after plugins override).
# The duplicate at end-of-file ensures this survives plugin overrides.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection

# ==============================================================================
# Navigation
# ==============================================================================

# Window switching.
bind -n C-PPage previous-window
bind -n C-NPage next-window

# Toggle last window with double prefix.
bind C-Space last-window

# Toggle last session.
bind a switch-client -l

# Create a new session (prompts for name).
bind S command-prompt -p "New session name:" "new-session -s '%%'"

# OpenCode instance picker (fuzzy search running instances).
bind o popup -w 80% -h 80% -E 'tmux-opencode-picker'

# Unbind Ctrl+Arrow (conflicts with terminal/shell word-jump).
unbind C-Left
unbind C-Right
unbind C-Up
unbind C-Down

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# ==============================================================================
# Nested Session (F12 Toggle)
# ==============================================================================

# Press F12 to disable all local keybindings so keys pass through to the inner
# tmux (e.g. over SSH). Press F12 again to re-enable. The status bar changes to
# indicate when local keys are off.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set mouse off \;\
  set status-style "fg=#5c6370,bg=#3e4452" \;\
  set window-status-current-style "fg=#e5c07b,bg=#3e4452" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u mouse \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  refresh-client -S

# ==============================================================================
# Prefix Stickiness
# ==============================================================================

# iOS WebSSH (webssh.net) dispatches synthetic focus DOM events every 1.5s as a
# cursor-blink workaround (src/ssh/assets/xterm-webssh.js:298-333). xterm.js
# translates each into ESC[I while focus-events is on; arriving mid-prefix it
# matches no binding and silently cancels prefix mode. Catch-all keeps prefix
# sticky; Escape becomes explicit cancel.
bind -T prefix Any    switch-client -T prefix
bind -T prefix Escape switch-client -T root

# ==============================================================================
# Mouse
# ==============================================================================

set -g mouse on

# ==============================================================================
# Floating Popup
# ==============================================================================

# Toggle a floating popup session.
bind f if-shell -F '#{==:#{session_name},floating}' {
    detach-client
} {
    set -gF '@last_session_name' '#S'
    popup -d '#{pane_current_path}' -E 'tmux new -A -s floating'
}

# Break floating pane into current session (foreground).
bind ! if-shell -F '#{!=:#{session_name},floating}' {
    break-pane
} {
    run-shell 'bash -c "tmux break-pane -s floating -t \"$(tmux show -gvq '@last_session_name'):\""'
}

# Break floating pane into current session (background).
bind @ if-shell -F '#{!=:#{session_name},floating}' {
    break-pane -d
} {
    run-shell 'bash -c "tmux break-pane -d -s floating -t \"$(tmux show -gvq '@last_session_name'):\""'
}

# ==============================================================================
# Plugins (TPM)
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'
set -g @plugin 'laktak/extrakto'

# -- Plugin Configuration -----------------------------------------------------

# Pain-control: resize increment.
set -g @pane_resize '1'

# Continuum: auto-restore and auto-start.
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'fullscreen'

# Easy-motion.
set -g @easy-motion-prefix "Space"

# Rebind v (easy-motion overrides it).
bind-key v next-layout
bind-key -T copy-mode-vi v send-keys -X begin-selection

# ==============================================================================
# Status Bar
# ==============================================================================

set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-style bg=default,fg='#5c6370'

# Left: session name (highlights on prefix or mode; shows OFF when keys pass through).
set -g status-left-length 30
set -g status-left '#{?#{==:#{client_key_table},off},#[fg=#e06c75 bold] OFF #[fg=#5c6370 nobold](#S) ,#{?client_prefix,#[fg=#e5c07b],#{?pane_in_mode,#[fg=#e5c07b reverse],#[fg=#98c379]}} (#S) }'

# Right: battery + clock.
set -g status-right '#[fg=#98c379]#(pmset -g batt | grep -Eo "\d+%%" | head -1) %H:%M %d/%m/%y'

# Window name: basename of current pane path (native format, no shell fork).
setw -g automatic-rename-format '#{b:pane_current_path}'

# Window status.
setw -g window-status-format         ' #I #W #{?window_zoomed_flag,(Z),}'
setw -g window-status-current-format ' #I #W #{?window_zoomed_flag,(Z),}'
setw -g window-status-style          fg='#5c6370',bg=default,none
setw -g window-status-current-style  fg='#98c379',bg=default,none
setw -g window-status-bell-style     fg='#e06c75',bg=default,none
setw -g window-status-activity-style fg='#e5c07b',bg=default,none

# Pane borders.
set -g pane-border-style        fg='#3e4452'
set -g pane-active-border-style fg='#98c379'

# Message style.
set -g message-style fg='#e5c07b',bg=default
set -g message-command-style fg='#98c379',bg=default

# ==============================================================================
# TPM Init (must be last line)
# ==============================================================================

# Ensure Homebrew binaries are on PATH for run-shell scripts (TPM, plugins).
# LaunchAgent-started servers inherit a minimal PATH that lacks /opt/homebrew/bin.
# Prepend to existing PATH rather than replacing it.
if-shell '[ -d /opt/homebrew/bin ]' {
  set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
}

run '~/.tmux/plugins/tpm/tpm'
